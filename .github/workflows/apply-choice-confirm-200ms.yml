name: Apply choice confirmation 200ms
on:
  push:
    branches:
      - work/choice-confirm-200ms-2026-09-03
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "0797cc4adf538aeaa904415e9ab31e0252e69628"
      - name: Shorten confirmation pause
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='const CHOICE_CONFIRM_MS=400;'
          new='const CHOICE_CONFIRM_MS=200;'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'const CHOICE_CONFIRM_MS=200;' index.html
          test "$(git diff --name-only)" = "index.html"
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Shorten ability choice confirmation to 200ms"
          git push origin HEAD:main
