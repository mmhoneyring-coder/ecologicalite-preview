name: Apply choice confirmation pause

on:
  push:
    branches:
      - work/choice-confirm-2026-09-03
    paths:
      - .github/workflows/apply-choice-confirm.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          ref: work/choice-confirm-2026-09-03

      - name: Preserve patch script
        run: cp .github/scripts/apply-choice-confirm.py /tmp/apply-choice-confirm.py

      - name: Checkout verified main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "06f54b0d45648943ecbc1028100b4377ec02faca"
          git checkout -B main origin/main

      - name: Apply patch
        run: python /tmp/apply-choice-confirm.py

      - name: Validate patch
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="v1r-runtime">(.*?)</script>',text,re.S)
          assert m, 'v1r-runtime not found'
          Path('/tmp/runtime.js').write_text(m.group(1),encoding='utf-8')
          assert 'const CHOICE_CONFIRM_MS=700;' in text
          assert text.count('choice-confirm-selected') >= 3
          assert text.count('confirmAbilityChoice(b,') == 3
          PY
          node --check /tmp/runtime.js
          test "$(git diff --name-only)" = "index.html"

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add ability choice confirmation pause"
          git push origin HEAD:main
