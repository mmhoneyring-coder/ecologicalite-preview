name: Apply SET1 ability grid

on:
  push:
    branches:
      - work/set1-ability-grid-trigger-2026-09-03
    paths:
      - .github/workflows/apply-set1-ability-grid.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/set1-ability-grid-trigger-2026-09-03
          fetch-depth: 0

      - name: Save patch script
        run: cp .github/scripts/patch-set1-ability-grid.py /tmp/patch-set1-ability-grid.py

      - name: Checkout and verify main
        run: |
          git checkout main
          test "$(git rev-parse HEAD)" = "1d995089258ba1798e57e56bd6a584d6d57040ae"

      - name: Apply patch
        run: python /tmp/patch-set1-ability-grid.py

      - name: Validate
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          assert "abilityGrid.className='run-normal-grid set-result-ability-grid'" in text
          assert "abilityGrid.append(card)" in text
          assert ".set-result-ability-grid{margin-top:0}" in text
          m = re.search(r'<script id="v1r-runtime">(.*?)</script>', text, re.S)
          assert m
          Path('/tmp/v1r-runtime.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/v1r-runtime.js

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show SET1 abilities in 2x3 grid"
          git push origin HEAD:main
