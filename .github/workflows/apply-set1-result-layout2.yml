name: Apply SET1 result layout fix

on:
  push:
    branches:
      - work/set1-result-layout2-trigger-2026-09-03
    paths:
      - .github/workflows/apply-set1-result-layout2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify base
        run: test "$(git rev-parse HEAD)" = "48214beefdc743328eac7a464dad613dd8c2da46"

      - name: Apply SET1 result fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')

          def once(old,new,label):
              global text
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              text=text.replace(old,new,1)

          def section(src,start,end):
              a=src.index(start); b=src.index(end,a)+len(end); return src[a:b]

          core_start='/* BEGIN ./core.mjs — preserve ecology/progression; renderer and score-view are display code. */'
          core_end='/* END ./core.mjs */'
          set_start='/* BEGIN ./set1-session.mjs — preserve ecology/progression; renderer and score-view are display code. */'
          set_end='/* END ./set1-session.mjs */'
          core_before=hashlib.sha256(section(text,core_start,core_end).encode()).hexdigest()
          set_before=hashlib.sha256(section(text,set_start,set_end).encode()).hexdigest()

          once(
              "const setAbilities=(s.selectionHistory||[]).filter(e=>e.type==='set'&&Number(e.set)===Number(setNo)).map(e=>({set:e.set,id:e.id,name:e.name}));",
              "const setAbilities=(s.selectionHistory||[]).filter(e=>e.type==='set'&&Number(e.set)===Number(setNo)&&e.selected).map(e=>({set:e.set,id:e.selected.id,name:e.selected.name}));",
              'SET ability snapshot'
          )

          old_fn="""function ensureSetResultNext(){
  let button=$('set-result-next');if(button)return button;
  button=document.createElement('button');button.id='set-result-next';button.type='button';button.className='primary set-result-next';button.textContent='SET 2へ';button.setAttribute('aria-label','SET 2の能力選択へ進む');
  button.onclick=()=>{hideSetResultNext();document.body.classList.remove('ui-set-result');$('result').classList.remove('set-result-mode');selectSecondSet();};
  resultCard()?.append(button);return button;
}"""
          new_fn="""function ensureSetResultNext(){
  let button=$('set-result-next');
  if(!button){
    button=document.createElement('button');button.id='set-result-next';button.type='button';button.className='primary set-result-next';button.textContent='SET 2へ';button.setAttribute('aria-label','SET 2の能力選択へ進む');
    button.onclick=()=>{hideSetResultNext();document.body.classList.remove('ui-set-result');$('result').classList.remove('set-result-mode');selectSecondSet();};
  }
  const card=resultCard(),details=card?.querySelector('details');if(card)card.insertBefore(button,details||null);return button;
}"""
          once(old_fn,new_fn,'SET2 button order')

          once(
              "#result.set-result-mode{align-items:flex-start!important;padding-top:18px!important}",
              "#result.set-result-mode{align-items:flex-end!important;padding-top:8px!important;padding-bottom:14px!important}",
              'SET result vertical position'
          )
          once(
              "@media(max-width:390px){#result.set-result-mode{padding-top:14px!important}#set-result-next{height:44px!important;min-height:44px!important;font-size:13.5px!important;line-height:42px!important}}",
              "@media(max-width:390px){#result.set-result-mode{padding-top:6px!important;padding-bottom:10px!important}#set-result-next{height:44px!important;min-height:44px!important;font-size:13.5px!important;line-height:42px!important}}",
              'SET result mobile position'
          )
          css_anchor="#set-result-next{box-sizing:border-box!important;width:100%!important;height:44px!important;min-height:44px!important;margin-top:10px!important;padding:0 14px!important;border:1px solid #818b95!important;border-radius:10px!important;background:linear-gradient(180deg,#2a3036 0%,#20262c 100%)!important;color:#eef2f5!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.10)!important;font-size:14px!important;font-weight:800!important;line-height:42px!important;letter-spacing:.02em!important}\n"
          css_add="#result.set-result-mode details{margin-top:12px!important;padding-top:8px!important;border-top:1px solid rgba(132,148,164,.28)!important}\n#result.set-result-mode details>summary{min-height:28px!important;padding:4px 2px!important;color:#9eabb7!important;font-size:9px!important;font-weight:650!important}\n"
          once(css_anchor,css_anchor+css_add,'SET result detail separation')

          core_after=hashlib.sha256(section(text,core_start,core_end).encode()).hexdigest()
          set_after=hashlib.sha256(section(text,set_start,set_end).encode()).hexdigest()
          if core_before!=core_after or set_before!=set_after:
              raise SystemExit('simulation/session code changed unexpectedly')

          path.write_text(text,encoding='utf-8')
          PY

      - name: Validate
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          assert "e.selected.id" in text and "e.selected.name" in text
          assert "card.insertBefore(button,details||null)" in text
          assert "#result.set-result-mode{align-items:flex-end!important" in text
          m=re.search(r'<script id="v1r-runtime">(.*?)</script>',text,re.S)
          assert m
          Path('/tmp/v1r-runtime.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v1r-runtime.js

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine SET1 result layout and details"
          git push origin HEAD:main
