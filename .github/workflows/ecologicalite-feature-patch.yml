name: Temporary EcologicaLite feature patch
on:
  push:
    branches:
      - chat/best-score-repro-20260903
    paths:
      - .github/workflows/ecologicalite-feature-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/best-score-repro-20260903
          fetch-depth: 0
      - name: Patch index
        run: python tools/patch_ecologicalite_features.py
      - name: Check UI script syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script id="v1r-ui">\s*(.*?)\s*</script>', text, re.S)
          if not match:
              raise SystemExit("v1r-ui script not found")
          Path("/tmp/v1r-ui.js").write_text(match.group(1), encoding="utf-8")
          print("UI script bytes:", len(match.group(1).encode("utf-8")))
          PY
          node --check /tmp/v1r-ui.js
      - name: Verify protected engine text remains
        run: |
          grep -F "const SCORE = Object.freeze({scoreHerbFeed:1,scoreCarnPred:30,scoreHerbBirth:20,scoreCarnBirth:120,scoreHerbSurvival:4,scoreCarnSurvival:15});" index.html
          grep -F "const csvColumns=['result_schema_version'" index.html
          grep -F "const values=[1,4,8]" index.html
          git diff --check
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --stat
          git commit -m "Add best run history and reproduction feedback"
          git push origin HEAD:chat/best-score-repro-20260903
