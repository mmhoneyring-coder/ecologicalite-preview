name: Temporary EcologicaLite feature smoke
on:
  push:
    branches:
      - chat/best-score-repro-20260903
    paths:
      - .github/workflows/ecologicalite-feature-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/best-score-repro-20260903
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Browser smoke test
        run: |
          python -m http.server 8000 >/tmp/ecologicalite-http.log 2>&1 &
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          driver=webdriver.Chrome(options=opts)
          wait=WebDriverWait(driver,15)
          try:
            driver.set_window_size(390,844)
            driver.get('http://127.0.0.1:8000/index.html')
            wait.until(EC.presence_of_all_elements_located((By.CSS_SELECTOR,'#choices .choice')))
            assert driver.execute_script("return document.getElementById('best-score-reset')!==null")
            driver.find_elements(By.CSS_SELECTOR,'#choices .choice')[0].click()
            wait.until(lambda d:d.execute_script("return window.__v1rSession && window.__v1rSession.phase==='running'"))
            assert driver.execute_script("return !!window.__v1rSession.world.observer && window.__v1rSession.world.observer.__ecologicaRepro===true")

            result=driver.execute_script("""
              const s=window.__v1rSession;
              let guard=0;
              while(!s.runDone && guard++<20000){
                while(!s.done && guard++<20000)s.step();
                if(s.phase==='stage-result'){const offers=s.offers();s.beginNext(offers[0]);}
                else if(s.phase==='set-result'){const offers=s.setOffers();s.beginSet(offers[0]);}
              }
              return {phase:s.phase,score:s.runScore(),stages:s.results.length};
            """)
            assert result['phase']=='run-result', result
            assert result['stages']==12, result
            driver.find_element(By.ID,'speed-cycle').click()
            wait.until(lambda d:d.find_element(By.ID,'status').text=='GAME SET')
            wait.until(lambda d:not d.find_element(By.ID,'best-score-overlay').get_attribute('hidden'))
            stored=driver.execute_script("""
              const key=Object.keys(localStorage).find(k=>k.startsWith('ecologicalite.bestRuns.'));
              const rows=key?JSON.parse(localStorage.getItem(key)):[];
              return {key,rows};
            """)
            assert stored['key'] and len(stored['rows'])==1, stored
            row=stored['rows'][0]
            assert len(row['stages'])==12
            assert all(k in row['scoreComponents'] for k in ['herbFeed','carnPred','herbBirth','carnBirth','herbSurvival','carnSurvival'])
            assert row['setAbilities'] and row['normalAbilities']
            assert driver.find_elements(By.CSS_SELECTOR,'#result-details .run-detail-abilities')
            assert len(driver.find_elements(By.CSS_SELECTOR,'#result-details .run-stage-table tbody tr'))==12
            assert 'NEW RECORD #1' in driver.find_element(By.ID,'best-new-record').text

            driver.find_element(By.CSS_SELECTOR,'.best-score-row').click()
            wait.until(lambda d:d.find_element(By.ID,'result-heading').get_attribute('aria-label')=='BEST #1')
            assert driver.find_elements(By.CSS_SELECTOR,'#result-details .run-detail-meta')
            assert 'seed' in driver.find_element(By.CSS_SELECTOR,'.run-detail-meta').text
            assert len(driver.find_elements(By.CSS_SELECTOR,'#result-details .run-stage-table tbody tr'))==12

            time.sleep(.3)
            geometry=driver.execute_script("""
              const g=document.getElementById('score-panel').getBoundingClientRect();
              const a=document.querySelector('.abilities-panel').getBoundingClientRect();
              const c=document.querySelector('.best-score-card').getBoundingClientRect();
              const actions=document.querySelector('.bottom-runtime-actions').getBoundingClientRect();
              return {g:{l:g.left,r:g.right,t:g.top,b:g.bottom},a:{l:a.left,r:a.right,t:a.top,b:a.bottom},c:{l:c.left,r:c.right,t:c.top,b:c.bottom},actions:{t:actions.top}};
            """)
            assert geometry['c']['l'] <= min(geometry['g']['l'],geometry['a']['l'])+2, geometry
            assert geometry['c']['r'] >= max(geometry['g']['r'],geometry['a']['r'])-2, geometry
            assert geometry['c']['b'] <= geometry['actions']['t']+2, geometry

            logs=driver.get_log('browser')
            severe=[x for x in logs if x.get('level')=='SEVERE']
            assert not severe, severe
            print('GAME SET score:',result['score'])
            print('BEST rows:',len(stored['rows']))
            print('Mobile overlay geometry:',geometry)
          finally:
            driver.quit()
          PY
