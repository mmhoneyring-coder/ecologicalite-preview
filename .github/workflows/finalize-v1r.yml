name: Finalize EcologicaLite v1R
on:
  push:
    branches:
      - work/finalize-v1r-2026-09-04
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify base
        run: test "$(git rev-parse HEAD)" = "1d0d05ae05b11d7954fdd6db63ae1889757505c5"
      - name: Finalize canonical docs
        run: python .github/scripts/finalize_v1r.py
      - name: Validate scope
        run: |
          git diff --check
          test -z "$(git diff --name-only | grep -v -E '^(README.md|docs/SPEC.md|docs/BALANCE.md|docs/DEVELOPMENT_LOG.md|docs/HISTORY.md)$')"
          grep -q '\*\*状態: 完成\*\*' README.md
          grep -q '状態: \*\*完成\*\*' docs/SPEC.md
          grep -q '状態: \*\*完成版の基準値\*\*' docs/BALANCE.md
          grep -q '## 19. バランス確認完了と最終完成判定' docs/DEVELOPMENT_LOG.md
          grep -q '現行完成版' docs/HISTORY.md
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/SPEC.md docs/BALANCE.md docs/DEVELOPMENT_LOG.md docs/HISTORY.md
          git commit -m 'Mark EcologicaLite v1R complete'
          git push origin HEAD:main
