name: Remove score SET context
on:
  push:
    branches:
      - chat/remove-score-set-label-20260903
    paths:
      - .github/workflows/remove-score-set-label.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/remove-score-set-label-20260903
      - name: Remove SET context from score card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            ".compact-score-label{font-size:0!important}.compact-score-label::before{content:'得点';font-size:9px}.compact-score-label::after{content:attr(data-context);margin-left:4px;color:#8396aa;font-size:6px;font-weight:700;letter-spacing:.08em}": ".compact-score-label{font-size:0!important}.compact-score-label::before{content:'得点';font-size:9px}.compact-score-label::after{content:none;display:none}",
            "const seedLabel=document.querySelector('label[for=\"seed\"]');if(seedLabel)seedLabel.textContent='seed';const seedButton=document.querySelector('#seed-form button');if(seedButton)seedButton.textContent='候補を表示';\n  $('set-summary').hidden=true;const scoreLabel=$('score-label');scoreLabel.classList.add('compact-score-label');scoreLabel.dataset.context='SET 1';label(scoreLabel,'得点','SET 1');": "const seedLabel=document.querySelector('label[for=\"seed\"]');if(seedLabel)seedLabel.textContent='seed';const seedButton=document.querySelector('#seed-form button');if(seedButton)seedButton.textContent='候補を表示';\n  $('set-summary').hidden=true;const scoreLabel=$('score-label');scoreLabel.classList.add('compact-score-label');label(scoreLabel,'得点');",
            "  $('score-label').dataset.context=`SET ${d.set}`;const scoreContext=$('score-label').querySelector('.ui-context');if(scoreContext)scoreContext.textContent=`SET ${d.set}`;\n": "",
            "$('status').textContent='能力選択待ち';label($('score-label'),'得点','SET 1');$('score-label').dataset.context='SET 1';": "$('status').textContent='能力選択待ち';label($('score-label'),'得点');"
          }
          for old,new in replacements.items():
            count=s.count(old)
            if count!=1:
              raise SystemExit(f'expected exactly one match, got {count}: {old[:70]}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F ".compact-score-label::after{content:none;display:none}" index.html
          if grep -F "$('score-label').dataset.context" index.html; then exit 1; fi
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove SET label from score card"
          git push origin HEAD:chat/remove-score-set-label-20260903
